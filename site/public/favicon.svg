      <stop offset="0" stop-color="#ffc277"/>
      <stop offset=".04" stop-color="#d9772e"/>
      <stop offset=".12" stop-color="#0d5563"/>
      <stop offset=".45" stop-color="#03838d"/>
      <stop offset=".75" stop-color="#19c8bf"/>
      <stop offset=".93" stop-color="#52f3e3"/>
      <stop offset="1" stop-color="#22d3c7"/>
    </linearGradient>
    <radialGradient id="copper" cx=".36" cy=".28" r=".8">
      <stop offset="0" stop-color="#fff3dc"/>
      <stop offset=".1" stop-color="#ffbf82"/>
      <stop offset=".36" stop-color="#f08a3e"/>
      <stop offset=".62" stop-color="#cf5e1e"/>
      <stop offset=".86" stop-color="#8a3110"/>
